<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisstyring gruppeture</title>
<style>
:root{
  --tekst:#333333; --bg:#F7F7F7; --plade:#FFFFFF; --blaa:#0D5879; --creme:#FFD5A7; --roed:#C30031;
  --linje:#E6E6E6; --graa:#8C8C8C; --groen:#2E7D32; --orange:#E1652A;
  --blaa-lys:#E7EFF3; --groen-lys:#E9F3EA; --roed-lys:#F9E6EB; --orange-lys:#FCEDE6; --creme-lys:#FFF4E8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tekst);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.tal{font-variant-numeric:tabular-nums}
/* top */
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--plade);border-bottom:1px solid var(--linje);position:sticky;top:0;z-index:20}
.logo{width:30px;height:30px;border-radius:7px;background:var(--blaa);display:grid;place-items:center;color:#fff;font-weight:700}
header h1{font-size:16px;margin:0}
header .sub{color:var(--graa);font-size:12px}
.faner{display:flex;gap:2px;margin-left:24px}
.faner button{border:0;background:none;padding:8px 14px;border-radius:6px;cursor:pointer;color:var(--graa);font-weight:600}
.faner button[aria-selected=true]{background:var(--blaa-lys);color:var(--blaa)}
.faner kbd{margin-left:6px}
.hoejre{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--graa);font-size:12px}
.proto{background:var(--creme);color:var(--tekst);border-radius:4px;padding:2px 8px;font-weight:600}
kbd{display:inline-block;min-width:16px;padding:0 4px;border:1px solid var(--linje);border-bottom-width:2px;border-radius:4px;background:#fff;font:11px/16px ui-monospace,Consolas,monospace;color:var(--graa);text-align:center}
main{padding:14px 20px 40px}
/* nøgletal */
.kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi .k{background:var(--plade);border:1px solid var(--linje);border-radius:8px;padding:10px 12px;cursor:default}
.kpi .k.klik{cursor:pointer}
.kpi .k.klik:hover{border-color:var(--blaa)}
.kpi .v{font-size:20px;font-weight:700}
.kpi .l{color:var(--graa);font-size:12px}
.kpi .d{font-size:12px;margin-top:2px}
/* værktøjslinje */
.vlinje{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--plade);border:1px solid var(--linje);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--blaa);color:#fff}
.seg .n{opacity:.75;margin-left:4px}
.vlinje input[type=search],.vlinje select{border:1px solid var(--linje);border-radius:7px;background:#fff;padding:6px 10px}
.vlinje input[type=search]{width:220px}
.knap{border:1px solid var(--linje);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600}
.knap:hover{border-color:var(--blaa);color:var(--blaa)}
.knap.primaer{background:var(--blaa);border-color:var(--blaa);color:#fff}
.knap.primaer:hover{filter:brightness(1.1);color:#fff}
.knap:disabled{opacity:.45;cursor:default}
.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--tekst)}
/* layout */
.arbejde{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:14px;align-items:start}
.ark{background:var(--plade);border:1px solid var(--linje);border-radius:8px;overflow:auto;height:calc(100vh - 232px);min-height:420px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:#fff;z-index:2;text-align:left;font-weight:600;font-size:12px;color:var(--graa);padding:6px 6px;height:46px;vertical-align:bottom;line-height:1.25;border-bottom:1px solid var(--linje);white-space:nowrap;cursor:pointer;user-select:none}
th.h,td.h{text-align:right}
th:hover{color:var(--blaa)}
th .pil{font-size:10px;margin-left:3px}
td{padding:6px 6px;border-bottom:1px solid #F0F0F0;vertical-align:middle;white-space:nowrap}
tr.r{cursor:pointer}
tr.r:hover td{background:#FAFBFC}
tr.r.valgt td{background:var(--blaa-lys)}
tr.r.valgt td:first-child{box-shadow:inset 3px 0 0 var(--blaa)}
tr.r.besl td{color:var(--graa)}
tr.gruppe td{background:var(--bg);font-weight:700;font-size:12px;padding:6px 8px;color:var(--tekst);cursor:pointer;position:sticky;top:46px;z-index:1}
tr.gruppe .n{color:var(--graa);font-weight:400;margin-left:6px}
td.kode b{font-size:13px}
td.kode .navn{display:block;color:var(--graa);font-size:11px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;line-height:18px}
.chip.haev{background:var(--blaa-lys);color:var(--blaa)}
.chip.kampagne{background:var(--orange-lys);color:var(--orange)}
.chip.holdoeje{background:#F0F0F0;color:var(--graa)}
.chip.ny{background:var(--creme);color:var(--tekst);margin-left:4px}
.chip.gl{background:#EDEDED;color:var(--tekst);margin-left:4px}
.chip.foran{background:var(--groen-lys);color:var(--groen)}
.chip.paa{background:#F0F0F0;color:var(--tekst)}
.chip.bagud{background:var(--roed-lys);color:var(--roed)}
.chip.tidligt{background:#fff;color:var(--graa);border:1px dashed var(--linje)}
.bel{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.bar{width:54px;height:6px;border-radius:3px;background:#EDEDED;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blaa)}
.lille{font-size:11px;color:var(--graa)}
.op{color:var(--groen)} .ned{color:var(--roed)}
.besl-ikon{font-weight:700}
.besl-ikon.foelg{color:var(--groen)} .besl-ikon.afvis{color:var(--roed)} .besl-ikon.senere{color:var(--orange)}
input[type=checkbox]{accent-color:var(--blaa);width:15px;height:15px;cursor:pointer}
/* bulk */
.bulk{display:none;position:sticky;bottom:0;background:var(--tekst);color:#fff;padding:8px 12px;gap:10px;align-items:center;border-radius:0 0 8px 8px}
.bulk.vis{display:flex}
.bulk .knap{background:transparent;color:#fff;border-color:#666}
/* detalje */
.detalje{background:var(--plade);border:1px solid var(--linje);border-radius:8px;height:calc(100vh - 232px);min-height:420px;overflow:auto}
.detalje .hoved{padding:14px 16px 10px;border-bottom:1px solid var(--linje)}
.detalje h2{font-size:17px;margin:0 0 2px}
.detalje .navn{color:var(--graa)}
.detalje .afsnit{padding:12px 16px;border-bottom:1px solid var(--linje)}
.detalje h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--graa);margin:0 0 8px}
.anbef{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.anbef .stor{font-size:22px;font-weight:700;color:var(--blaa)}
.anbef.kampagne .stor{color:var(--orange)}
.anbef.holdoeje .stor{color:var(--tekst);font-size:17px}
.kortsagt{margin-top:6px}
.noegle{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.noegle div{background:var(--bg);border-radius:6px;padding:6px 8px}
.noegle b{display:block;font-size:14px}
.noegle span{font-size:11px;color:var(--graa)}
.graf svg{display:block;width:100%;height:auto}
.forklar{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--graa);margin-top:4px}
.forklar i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.argumenter{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.argumenter ul{margin:0;padding:0;list-style:none}
.argumenter li{padding:5px 0 5px 18px;position:relative;border-top:1px solid #F2F2F2}
.argumenter li:first-child{border-top:0}
.argumenter li.tom{padding-left:0}
.argumenter li.tom::before{content:none}
.argumenter li::before{position:absolute;left:0;top:5px;font-weight:700}
.for li::before{content:"+";color:var(--groen)}
.imod li::before{content:"−";color:var(--roed)}
.argumenter h4{margin:0 0 4px;font-size:12px}
.tom{color:var(--graa);font-style:italic}
.stige{display:flex;gap:4px;flex-wrap:wrap}
.trin{border:1px solid var(--linje);background:#fff;border-radius:6px;padding:4px 7px;cursor:pointer;text-align:center;min-width:70px}
.trin b{display:block;font-size:13px}
.trin span{font-size:10px;color:var(--graa)}
.trin.foreslaaet{border-color:var(--blaa)}
.trin.foreslaaet span{color:var(--blaa)}
.trin.over{background:repeating-linear-gradient(135deg,#fff,#fff 5px,#FBEFF2 5px,#FBEFF2 8px)}
.trin[aria-pressed=true]{background:var(--blaa);border-color:var(--blaa);color:#fff}
.trin[aria-pressed=true] span{color:#fff}
.trin.pm{outline:2px dashed var(--graa);outline-offset:1px}
.advarsel{margin-top:8px;padding:6px 8px;border-radius:6px;background:var(--roed-lys);color:var(--roed);font-size:12px;display:none}
.advarsel.vis{display:block}
.note.uds{position:relative}
details.info{display:inline}
details.info summary{display:inline-block;vertical-align:middle;list-style:none;cursor:pointer;width:15px;height:15px;border-radius:50%;border:1px solid var(--blaa);color:var(--blaa);font:600 10px/13px Georgia,serif;font-style:italic;text-align:center;user-select:none}
details.info summary::-webkit-details-marker{display:none}
details.info[open] summary{background:var(--blaa);color:#fff}
details.info .pop{display:block;margin-top:8px;background:#fff;border:1px solid var(--linje);border-left:3px solid var(--blaa);border-radius:6px;padding:10px 12px;color:var(--tekst);font-size:12px;line-height:1.45;z-index:20}
details.info .pop p{margin:6px 0 0}
.note.bloed{display:none;margin-top:8px;color:var(--orange,#E1652A)}.note.bloed.vis{display:block}
.beslut{display:flex;gap:6px;margin-bottom:8px}
.beslut .knap{flex:1}
.beslut .knap[aria-pressed=true]{background:var(--blaa);color:#fff;border-color:var(--blaa)}
.beslut .knap.afv[aria-pressed=true]{background:var(--roed);border-color:var(--roed)}
.beslut .knap.sen[aria-pressed=true]{background:var(--orange);border-color:var(--orange)}
.aarsager{display:none;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.aarsager.vis{display:flex}
.aarsager button{border:1px solid var(--linje);background:#fff;border-radius:12px;padding:3px 10px;cursor:pointer;font-size:12px}
.aarsager button[aria-pressed=true]{background:var(--tekst);color:#fff;border-color:var(--tekst)}
textarea{width:100%;min-height:54px;border:1px solid var(--linje);border-radius:6px;padding:6px 8px;resize:vertical}
.genveje{color:var(--graa);font-size:11px;margin-top:6px}
.prisforloeb{font-size:12px}
.prisforloeb .pt{display:inline-block;margin-right:4px}
.sml{width:100%;font-size:12px}
.sml td,.sml th{padding:4px 6px;border-bottom:1px solid #F2F2F2;position:static;cursor:default}
.sml th{color:var(--graa);font-weight:600}
.sml td.h,.sml th.h{text-align:right}
/* portefølje */
.port{background:var(--plade);border:1px solid var(--linje);border-radius:8px;overflow:auto;height:calc(100vh - 262px);min-height:420px}
#detalje2{height:calc(100vh - 262px)}
.port table td,.port table th{padding:3px 4px;border-bottom:1px solid #F2F2F2;vertical-align:middle}
.port th{cursor:default;text-align:center;position:sticky;top:0}
.port th.serie,.port td.serie{position:sticky;left:0;background:#fff;text-align:left;z-index:3;min-width:132px;max-width:132px}
.port th.serie{z-index:4}
.port td.serie b{font-size:12px}
.port td.serie span{display:block;color:var(--graa);font-size:10px;max-width:128px;overflow:hidden;text-overflow:ellipsis}
.port td.md{min-width:52px;text-align:center;white-space:normal;max-width:76px}
.port tr.region td{background:var(--bg);font-weight:700}
.port td.sum{color:var(--graa);font-size:11px;text-align:right}
.felt{display:inline-block;width:22px;height:22px;border-radius:4px;margin:1px;cursor:pointer;font-size:9px;line-height:22px;text-align:center;color:#fff;font-weight:700;position:relative}
.felt.foran{background:var(--groen)} .felt.paa{background:#A6A6A6} .felt.bagud{background:var(--roed)}
.felt.tidligt{background:#fff;border:1px dashed #BDBDBD;color:var(--graa)}
.felt.udsolgt{background:var(--blaa)}
.felt.f-haev{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blaa)}
.felt.f-kampagne{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--orange)}
.felt:hover{transform:scale(1.15);z-index:5}
.legende{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--graa);margin:0 0 10px}
.legende .felt{cursor:default;width:16px;height:16px;line-height:16px;vertical-align:middle;margin-right:4px}
.legende .felt:hover{transform:none}
.tip{position:fixed;pointer-events:none;background:var(--tekst);color:#fff;border-radius:6px;padding:7px 9px;font-size:12px;z-index:50;display:none;max-width:280px}
.portlayout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;align-items:start}
/* udfald */
.kort{background:var(--plade);border:1px solid var(--linje);border-radius:8px;padding:16px;margin-bottom:12px}
.kort h2{font-size:15px;margin:0 0 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tekst);color:#fff;padding:9px 14px;border-radius:7px;display:none;z-index:60}
.skjult{display:none!important}
.note{color:var(--graa);font-size:11px;margin-top:6px}
</style>
</head>

<header>
  <div class="logo">T</div>
  <div>

</main>

function indlaes(forslag, portefoelje) {

    if (s.salg_kurve) SALG[r.turkode] = s.salg_kurve;
    if (s.ly_salg_kurve && s.sidste_aars_tur) SALG[s.sidste_aars_tur] = s.ly_salg_kurve;

  NAVN_SERIE = {}; F.forEach(r => { NAVN_SERIE[r.turkode.slice(0, 4)] = r.navn; });
  PORT_FULD = !!portefoelje;
  const kilde = portefoelje || F.map(r => ({ turkode: r.turkode, afrejse: r.afrejse, dage_til_afrejse: r.dage, max_pax: r.max_pax, solgt: r.solgt, pris_nu: r.pris_nu, sidste_aars_tur: r.s.sidste_aars_tur, ly_solgt_nu: r.s.ly_solgt_nu, solgt_14d: r.s.solgt_14d, ...r.s }));
  AFG = kilde.map(x => ({ turkode: x.turkode, afrejse: x.afrejse, dage: x.dage_til_afrejse ?? x.dage, max_pax: x.max_pax, solgt: x.solgt, pris_nu: x.pris_nu, ly_tur: x.sidste_aars_tur || null, ly_solgt: x.ly_solgt_nu ?? null, solgt_14d: x.solgt_14d ?? 0, navn: x.navn || "", p: prognose(x) }));
  AFG.forEach(a => { a.region = region(a.turkode); a.f = FK[a.turkode] || null; if (a.f) a.p = a.f.p; if (!a.navn && a.f) a.navn = a.f.navn; if (a.navn) NAVN_SERIE[a.turkode.slice(0, 4)] ||= a.navn; });

// Detaljekald (S3): daglig salgskurve i år og sidste år, prisforløb og købskurve. Siden virker uden, indtil kaldet findes.
async function hentDetalje(turkode, el) {
  if (!KALD_DETALJE || DETALJE[turkode]) return;
  DETALJE[turkode] = "henter";
  const { data, error } = await sb.rpc("pris_afgang_detalje", { p_turkode: turkode });
  if (error) { DETALJE[turkode] = "mangler"; if (error.code === "PGRST202" || /Could not find the function/i.test(error.message)) KALD_DETALJE = false; return; }
  const d = Array.isArray(data) ? data[0] : data;
  if (d) {
    const ly = FK[turkode]?.s.sidste_aars_tur || AFGK[turkode]?.ly_tur;
    if (d.salg_kurve?.length) SALG[turkode] = d.salg_kurve;
    if (d.ly_salg_kurve?.length && ly) SALG[ly] = d.ly_salg_kurve;

    if (d.koebskurve?.dage) KURVE[turkode] = d.koebskurve;
  }
  DETALJE[turkode] = "ok";
  if (el && el.dataset.t === turkode) tegnDetalje(el, turkode, true);
}

    const { error } = await sb.rpc("pris_gem_beslutning", { p_forslag_id: r.forslag_id, p_beslutning: t.beslutning, p_feedback: fri, p_valgt_pris: pris, p_aarsag: t.beslutning === "afvis" ? AARSAG_KODE[t.aarsag] ?? null : null, p_udsaet_til: t.beslutning === "senere" ? UDSAET_KODE[t.udsaet] ?? null : null, p_kampagne_pladser: r.forslag === "kampagne" && t.beslutning === "følg" ? t.pladser ?? null : null, p_kampagne_dage: r.forslag === "kampagne" && t.beslutning === "følg" ? t.periode ?? null : null });
    if (!error) return null;
    if (!(error.code === "PGRST202" || /Could not find the function/i.test(error.message))) return error;
    S5 = false;
  }
  const mærker = [pris ? `[pris ${pris}]` : "", t.beslutning === "følg" && r.forslag === "kampagne" && t.pladser ? `[pladser ${t.pladser}, ${t.periode || 14} dage]` : "", t.beslutning === "afvis" && t.aarsag ? `[årsag: ${t.aarsag}]` : "", t.beslutning === "senere" && t.udsaet ? `[senere: ${t.udsaet}]` : ""].filter(Boolean).join(" ");
  const { error } = await sb.rpc("pris_giv_beslutning", { p_forslag_id: r.forslag_id, p_beslutning: t.beslutning, p_feedback: (mærker + (mærker && fri ? " " : "") + fri).slice(0, 2000) });
  return error || null;
}
async function gem(r, el) {
  const t = r.lokal;

  const st = el.querySelector("#gemt"); if (st) st.textContent = "Gemmer …";
  const fejl = await send(r, t);
  if (fejl) { if (st) { st.textContent = "Kunne ikke gemme: " + fejl.message; st.style.color = "var(--roed)"; } if (knap) knap.disabled = false; return; }
  r.beslutning = t.beslutning === "fortryd" ? null : t.beslutning; r.feedback = t.feedback; r.initialer = INITIALER; t.gemt = true;
  r.valgt_pris = t.beslutning === "følg" ? (t.pris ?? null) : null; r.aarsag = t.beslutning === "afvis" ? AARSAG_KODE[t.aarsag] ?? null : null; r.udsaet_til = t.beslutning === "senere" ? UDSAET_KODE[t.udsaet] ?? null : null;
  toast(t.beslutning === "fortryd" ? `${r.turkode}: beslutningen er fortrudt` : `${r.turkode}: ${t.beslutning}${t.beslutning === "følg" && t.pris ? " · " + kr(t.pris) : ""}${t.aarsag && t.beslutning === "afvis" ? " · " + t.aarsag : ""} er gemt`);
  if (t.beslutning === "fortryd") r.lokal = null;
  tegnKpi();
  const L = synlige(), i = L.findIndex(x => x.turkode === r.turkode);
  if (el.id === "detalje") { const naeste = L[i + 1] || L[i - 1]; T.valgt = (T.koe === "beslut" ? (synlige().find((x, j) => j >= Math.max(0, i)) || naeste) : naeste)?.turkode || r.turkode; tegnTabel(); }
  else { tegnDetalje(el, r.turkode); tegnPort(); }
}
function tegnAfgangUdenForslag(el, a) {

// ---------- portefølje ----------
function tegnPort() {
  const md = []; for (let i = 0; i < 12; i++) { const d = new Date(2026, 10 + i, 1); md.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); }
  const serier = {};
  AFG.forEach(a => { const k = a.turkode.slice(0, 4); (serier[k] ||= { k, region: a.region, afg: [] }).afg.push(a); });
  let liste = Object.values(serier);
  if (T.portKun) liste = liste.filter(s => s.afg.some(a => a.f && a.f.forslag !== "hold øje"));
  const farve = a => {
    if (T.farve === "ly") {
      if (!a.ly_tur || a.ly_solgt == null) return "tidligt";
      const d = a.solgt - a.ly_solgt; return d >= 2 ? "foran" : d <= -2 ? "bagud" : "paa";
    }
    return a.p.status;
  };
  let h = `<table><thead><tr><th class="serie">Serie</th>${md.map(m => `<th>${MD[+m.slice(5) - 1]} ${m.slice(2, 4)}</th>`).join("")}<th class="h">Solgt</th></tr></thead><tbody>`;
  for (const reg of ["Europa", "Grønland", "Oversøisk"]) {
    const ser = liste.filter(s => s.region === reg).sort((a, b) => a.k.localeCompare(b.k));
    if (!ser.length) continue;
    const sol = ser.reduce((x, s) => x + s.afg.reduce((y, a) => y + a.solgt, 0), 0), mx = ser.reduce((x, s) => x + s.afg.reduce((y, a) => y + a.max_pax, 0), 0);
    h += `<tr class="region"><td class="serie" style="background:var(--bg)">${reg} <span class="lille">${ser.length} serier</span></td><td colspan="${md.length}"></td><td class="sum tal">${tal(sol)}/${tal(mx)}</td></tr>`;
    for (const s of ser) {
      const sol = s.afg.reduce((y, a) => y + a.solgt, 0), mx = s.afg.reduce((y, a) => y + a.max_pax, 0);
      h += `<tr><td class="serie"><b>${s.k}</b><span>${esc(NAVN_SERIE[s.k] || "")}</span></td>`;
      for (const m of md) {
        const fs = s.afg.filter(a => a.afrejse.slice(0, 7) === m);
        h += `<td class="md">${fs.map(a => { const f = a.f && a.f.forslag !== "hold øje" ? (a.f.forslag === "hæv" ? " f-haev" : " f-kampagne") : ""; return `<span class="felt ${farve(a)}${f}${T.valgt2 === a.turkode ? " valgt" : ""}" data-t="${a.turkode}" style="${T.valgt2 === a.turkode ? "outline:2px solid #333;outline-offset:2px" : ""}">${a.max_pax ? Math.round(100 * a.solgt / a.max_pax) : ""}</span>`; }).join("")}</td>`;
      }
      h += `<td class="sum tal">${sol}/${mx}</td></tr>`;
    }
  }
  document.getElementById("port").innerHTML = (PORT_FULD ? "" : `<div class="note" style="padding:8px 10px;margin:0">Viser de ${AFG.length} afgange med forslag eller hold øje. Alle afgange 14–365 dage kommer med, når maskinrummets porteføljekald er klar.</div>`) + h + "</tbody></table>";
  document.getElementById("legende").innerHTML = (T.farve === "ly" ? `<span><span class="felt foran"></span>mindst 2 flere solgt end sidste år</span><span><span class="felt paa"></span>på niveau (±1)</span><span><span class="felt bagud"></span>mindst 2 færre</span><span><span class="felt tidligt"></span>ingen sammenlignelig afgang</span>` :
    `<span><span class="felt foran"></span>foran købskurven</span><span><span class="felt paa"></span>på kurs</span><span><span class="felt bagud"></span>bagud</span><span><span class="felt udsolgt"></span>udsolgt</span><span><span class="felt tidligt"></span>for tidligt at læse</span>`) +
    `<span><span class="felt paa f-haev"></span>forslag: hæv</span><span><span class="felt paa f-kampagne"></span>forslag: kampagne</span><span>Tallet i feltet er belægning i %</span>`;
  document.querySelectorAll("#port .felt").forEach(f => {
    f.onmouseenter = e => { const a = AFGK[f.dataset.t]; visTip(e, `<b>${a.turkode}</b> · ${dato(a.afrejse)} (${a.dage} d)<br>Solgt ${a.solgt}/${a.max_pax} · tempo: ${a.p.tekst.toLowerCase()}<br>Sidste år samme dag: ${a.ly_tur ? tal(a.ly_solgt) + " (" + a.ly_tur + ")" : "–"}<br>Pris ${kr(a.pris_nu)}${a.f ? "<br>Forslag i dag: " + a.f.forslag : ""}`); };
    f.onmousemove = e => flytTip(e);
    f.onmouseleave = () => skjulTip();
    f.onclick = () => { T.valgt2 = f.dataset.t; tegnPort(); };
  });
  if (!T.valgt2) T.valgt2 = (AFG.find(a => a.f && a.f.forslag === "hæv") || AFG[0]).turkode;
  tegnDetalje(document.getElementById("detalje2"), T.valgt2);
}
const tip = document.getElementById("tip");
function visTip(e, h) { tip.innerHTML = h; tip.style.display = "block"; flytTip(e); }
function flytTip(e) { tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function skjulTip() { tip.style.display = "none"; }

// ---------- faner, filtre, tastatur ----------
function skiftFane(f) {
  T.fane = f;
  document.querySelectorAll(".faner button").forEach(b => b.setAttribute("aria-selected", b.dataset.fane === f));
  for (const x of ["idag", "port", "udfald"]) document.getElementById("fane-" + x).classList.toggle("skjult", x !== f);
  if (f === "idag") tegnTabel(); else if (f === "port") tegnPort(); else tegnUdfald();
}
function saetKoe(k) { T.koe = k; document.querySelectorAll("#koe button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k)); T.valgt = null; tegnTabel(); }
document.querySelectorAll(".faner button").forEach(b => b.onclick = () => skiftFane(b.dataset.fane));
document.querySelectorAll("#koe button").forEach(b => b.onclick = () => saetKoe(b.dataset.k));
document.querySelectorAll("#region button").forEach(b => b.onclick = () => { T.region = b.dataset.r; document.querySelectorAll("#region button").forEach(x => x.setAttribute("aria-pressed", x === b)); tegnTabel(); });
document.querySelectorAll("#farve button").forEach(b => b.onclick = () => { T.farve = b.dataset.c; document.querySelectorAll("#farve button").forEach(x => x.setAttribute("aria-pressed", x === b)); tegnPort(); });
document.getElementById("portKunForslag").onchange = e => { T.portKun = e.target.checked; tegnPort(); };
const mSel = document.getElementById("maaned");
[...new Set(F.map(r => r.afrejse.slice(0, 7)))].sort().forEach(m => mSel.insertAdjacentHTML("beforeend", `<option value="${m}">${MD[+m.slice(5) - 1]} ${m.slice(0, 4)}</option>`));
mSel.onchange = () => { T.maaned = mSel.value; tegnTabel(); };
document.getElementById("kunNy").onchange = e => { T.kunNy = e.target.checked; tegnTabel(); };
document.getElementById("soeg").oninput = e => { T.soeg = e.target.value.trim(); tegnTabel(); };
document.getElementById("thead").onclick = e => { const th = e.target.closest("th"); if (!th || !th.dataset.s) return; if (T.sort === th.dataset.s) { if (T.retning === -1) { T.sort = null; T.retning = 1; } else T.retning = -1; } else { T.sort = th.dataset.s; T.retning = 1; } tegnTabel(); };
document.getElementById("linjer").onclick = e => {
  const g = e.target.closest("tr.gruppe"); if (g) { const k = g.dataset.g; T.lukket.has(k) ? T.lukket.delete(k) : T.lukket.add(k); tegnTabel(); return; }
  const tr = e.target.closest("tr.r"); if (!tr) return;
  if (e.target.classList.contains("mk")) { e.target.checked ? T.markeret.add(tr.dataset.t) : T.markeret.delete(tr.dataset.t); tegnBulk(); return; }
  T.valgt = tr.dataset.t; markerValgt(); tegnDetalje(document.getElementById("detalje"), T.valgt);
};
async function bulk(v) {
  let n = 0, fejl = 0;
  for (const t of [...T.markeret]) {
    const r = FK[t]; if (!r) continue;
    const l = { ...(r.lokal || {}), beslutning: v, pris: v === "følg" && r.forslag === "hæv" ? r.forslag_pris_fra : r.lokal?.pris ?? null, feedback: r.lokal?.feedback || "" };
    const e = await send(r, l);
    if (e) { fejl++; continue; }
    r.lokal = { ...l, gemt: true }; r.beslutning = v; r.initialer = INITIALER; n++;
  }
  T.markeret.clear(); toast(`${n} afgange: ${v} er gemt${fejl ? ` · ${fejl} kunne ikke gemmes` : ""}`); tegnKpi(); tegnTabel();
}
document.getElementById("bulkFoelg").onclick = () => bulk("følg");
document.getElementById("bulkSenere").onclick = () => bulk("senere");
document.getElementById("bulkAfvis").onclick = () => bulk("afvis");
document.getElementById("excel").onclick = () => {
  const L = synlige();
  const kol = ["Turkode", "Rejse", "Afrejse", "Dage", "Forslag", "Solgt", "Max pax", "Tempo mod købskurve", "Sidste års tur", "Solgt sidste år samme dag", "Køber typisk (dage før)", "Trafik tursiden mod sidste år (%)", "Pris i dag", "Forslag fra", "Forslag til", "Kampagne fra", "Kampagne til", "Pointmodel", "Beslutning", "Begrundelser"];
  const rk = L.map(r => [r.turkode, r.navn, r.afrejse, r.dage, r.forslag, r.solgt, r.max_pax, r.p.tekst, r.s.sidste_aars_tur || "", r.s.ly_solgt_nu ?? "", r.s.median_koebsdag ?? "", r.s.web_vaekst_pct ?? "", r.pris_nu, r.forslag_pris_fra ?? "", r.forslag_pris_til ?? "", r.kampagne_pris_fra ?? "", r.kampagne_pris_til ?? "", r.s.pointmodel_pris ?? "", beslutning(r) || "", (r.begrundelser || []).join(" | ")]);
  const csv = "﻿" + [kol, ...rk].map(x => x.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "prisforslag-" + IDAG + ".csv"; a.click();
};
document.addEventListener("keydown", e => {
  const iFelt = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (e.key === "Escape") { if (iFelt) document.activeElement.blur(); T.markeret.clear(); if (T.fane === "idag") tegnTabel(); return; }
  if (iFelt) return;
  if (e.key === "1") return skiftFane("idag");
  if (e.key === "2") return skiftFane("port");
  if (e.key === "3") return skiftFane("udfald");
  if (T.fane !== "idag") return;
  const L = synlige(), i = L.findIndex(r => r.turkode === T.valgt), el = document.getElementById("detalje");
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); const n = L[Math.min(L.length - 1, i + 1)]; if (n) { T.valgt = n.turkode; markerValgt(); tegnDetalje(el, T.valgt); } }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); const n = L[Math.max(0, i - 1)]; if (n) { T.valgt = n.turkode; markerValgt(); tegnDetalje(el, T.valgt); } }
  else if (e.key === "/") { e.preventDefault(); document.getElementById("soeg").focus(); }
  else if (e.key === "x" && T.valgt) { T.markeret.has(T.valgt) ? T.markeret.delete(T.valgt) : T.markeret.add(T.valgt); tegnTabel(); }
  else if ((e.key === "f" || e.key === "a" || e.key === "s") && T.valgt) { vaelgBeslutning(el, FK[T.valgt], { f: "følg", a: "afvis", s: "senere" }[e.key]); if (e.key === "a") el.querySelector("#fb").focus(); }
  else if (e.key === "Enter" && T.valgt && FK[T.valgt].lokal?.beslutning) gem(FK[T.valgt], el);
});
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = "none", 2600); }

let INITIALER = "";
function besked(h) { document.querySelector("main").innerHTML = `<div class="kort" style="max-width:640px;margin:40px auto">${h}</div>`; }
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { besked(`<h2>Log ind først</h2><p>Prisstyringen bruger dit login fra Topas BI Agent. <a href="./">Log ind i Topas BI Agent</a> i samme browser, og åbn så siden igen.</p>`); return; }
  const mail = session.user.email || "";
  INITIALER = mail.split("@")[0].toUpperCase();
  document.getElementById("bruger").textContent = mail;
  let { data, error } = await sb.rpc("pris_forslag_liste");
  if (error && (error.code === "PGRST202" || /Could not find the function/i.test(error.message))) ({ data, error } = await sb.rpc("pris_dagens_forslag"));
  if (error) { besked(`<h2>Kunne ikke hente forslagene</h2><p>${esc(error.message)}</p><p><a href="./">Log ind igen i Topas BI Agent</a></p>`); return; }
  if (!data?.length) { besked(`<h2>Ingen forslag</h2><p>Enten har morgenkørslen ikke kørt endnu, eller din bruger har ikke adgang til prisforslag.</p>`); return; }
  let port = null;
  const pr = await sb.rpc("pris_portefoelje");
  if (!pr.error && pr.data?.length) port = pr.data;
  IDAG = data[0].dato;
  indlaes(data, port);
  document.getElementById("dataDato").textContent = `Morgenkørsel ${dato(IDAG)} · ${F.length} afgange med forslag eller hold øje${PORT_FULD ? ` · ${AFG.length} afgange i alt` : ""}`;
  tegnKpi();
  tegnTabel();
}
start();
